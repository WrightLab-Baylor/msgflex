<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MSGFLEX Pipeline — Fig. 1</title>
<style>
  :root{
    --bg:#fafaf7;
    --ink:#1f2230;
    --rule:#d8d6cf;
  }
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color:var(--ink);
    padding:32px 24px 48px;
    display:flex; flex-direction:column; align-items:center;
  }
  .figure{
    width:min(1500px, 100%);
    background:#ffffff;
    border:1px solid var(--rule);
    border-radius:6px;
    padding:24px 24px 18px;
    box-shadow:0 1px 0 rgba(0,0,0,0.02);
  }
  .figure svg{ width:100%; height:auto; display:block; }
  figcaption{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--rule);
    font-size:13px;
    line-height:1.55;
    color:#3a3d4a;
    font-family: "Times New Roman", Times, Georgia, serif;
  }
  figcaption b{ font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing:0.02em; }
  figcaption code{ font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size:12px; background:#f3f1ec; padding:1px 5px; border-radius:3px; }
</style>
</head>
<body>

<figure class="figure" data-screen-label="01 MSGFLEX Pipeline">
<svg viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">MSGFLEX proteomics pipeline overview</title>
  <desc id="figDesc">Three-stage flowchart: SPARX, XPECTRA, and QUANTIX side-by-side.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2230"/>
    </marker>
    <marker id="arrow-skip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9b9a93"/>
    </marker>
    <marker id="arrow-sparx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2D6A7F"/>
    </marker>
    <marker id="arrow-xpec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C47B2B"/>
    </marker>
    <marker id="arrow-quant" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A7D44"/>
    </marker>

    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="transparent"/>
      <circle cx="1" cy="1" r="0.4" fill="rgba(0,0,0,0.025)"/>
    </pattern>

    <linearGradient id="g-input" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#264872"/>
      <stop offset="1" stop-color="#1A3354"/>
    </linearGradient>
    <linearGradient id="g-output" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5A35"/>
      <stop offset="1" stop-color="#6B4326"/>
    </linearGradient>
  </defs>

  <style>
    .lbl { font: 12.5px "Helvetica Neue", Helvetica, Arial, sans-serif; fill:#1f2230; }
    .lbl-sm { font: 10.5px "Helvetica Neue", Helvetica, Arial, sans-serif; fill:#4a4d5a; }
    .lbl-tiny { font: 9.5px "Helvetica Neue", Helvetica, Arial, sans-serif; fill:#5a5d6a; letter-spacing:0.04em;}
    .lbl-w { fill:#ffffff; }
    .lbl-b { font-weight:700; }
    .lbl-stage { font: 700 11px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing:0.18em; }
    .edge { stroke:#1f2230; stroke-width:1.4; fill:none; }
    .edge-skip { stroke:#9b9a93; stroke-width:1.4; fill:none; stroke-dasharray:6 4; stroke-dashoffset:18;}
    .edge-sparx { stroke:#2D6A7F; stroke-width:1.4; fill:none; }
    .edge-xpec { stroke:#C47B2B; stroke-width:1.4; fill:none; }
    .edge-quant { stroke:#3A7D44; stroke-width:1.4; fill:none; }
    .edge-lbl-bg { fill:#ffffff; }
    .edge-lbl { font: 10px "Helvetica Neue", Helvetica, Arial, sans-serif; fill:#3a3d4a; letter-spacing:0.02em;}
    .badge-text { font: 9px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing:0.06em; font-weight:600; }
  </style>

  <!-- ============ INPUTS ROW (top, spans across SPARX column) ============ -->
  <g id="inputs">
    <text x="40" y="32" class="lbl-stage" fill="#1E3A5F">INPUTS</text>

    <g transform="translate(40,46)">
      <rect width="150" height="44" rx="8" fill="url(#g-input)" stroke="#0f213b" stroke-width="0.8"/>
      <text x="75" y="20" text-anchor="middle" class="lbl lbl-w lbl-b">RAW / mzML</text>
      <text x="75" y="35" text-anchor="middle" class="lbl-tiny" fill="#ffffff" style="fill: rgb(255, 255, 255)">spectra input</text>
    </g>
    <g transform="translate(200,46)">
      <rect width="150" height="44" rx="8" fill="url(#g-input)" stroke="#0f213b" stroke-width="0.8"/>
      <text x="75" y="20" text-anchor="middle" class="lbl lbl-w lbl-b">FASTA database</text>
      <text x="75" y="35" text-anchor="middle" class="lbl-tiny" fill="#ffffff" style="fill: rgb(255, 255, 255)">protein sequences</text>
    </g>
    <g transform="translate(360,46)">
      <rect width="150" height="44" rx="8" fill="url(#g-input)" stroke="#0f213b" stroke-width="0.8"/>
      <text x="75" y="20" text-anchor="middle" class="lbl lbl-w lbl-b">params.txt</text>
      <text x="75" y="35" text-anchor="middle" class="lbl-tiny" fill="#ffffff" style="fill: rgb(255, 255, 255)">MS-GF+ config</text>
    </g>

    <!-- Manifold collecting inputs -->
    <path class="edge" d="M115,90 L115,108 L275,108"/>
    <path class="edge" d="M275,90 L275,108"/>
    <path class="edge" d="M435,90 L435,108 L275,108"/>
    <path class="edge" d="M275,108 L275,128" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ STAGE 1: SPARX (left column) ============ -->
  <g id="stage-sparx">
    <rect x="20" y="130" width="510" height="780" rx="10" ry="10"
          fill="#f3f7f8" stroke="#2D6A7F" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="20" y="130" width="510" height="780" rx="10" ry="10" fill="url(#grain)"/>

    <rect x="20" y="130" width="170" height="26" rx="10" ry="10" fill="#2D6A7F"/>
    <rect x="20" y="143" width="170" height="13" fill="#2D6A7F"/>
    <text x="36" y="147" class="lbl-stage" fill="#ffffff">STAGE 1</text>
    <text x="96" y="147" class="lbl-stage" fill="#ffffff">·  SPARX</text>
    <text x="36" y="172" class="lbl-sm" fill="#2D6A7F">Upstream search &amp; spectral processing</text>

    <!-- Step 0: Raw File Conversion -->
    <g transform="translate(155,188)">
      <rect width="240" height="56" rx="8" fill="#ffffff" stroke="#2D6A7F" stroke-width="1.4"/>
      <text x="120" y="24" text-anchor="middle" class="lbl lbl-b">Raw File Conversion</text>
      <text x="120" y="42" text-anchor="middle" class="lbl-sm">vendor → mzML / MGF</text>
      <g transform="translate(60,-10)">
        <rect width="120" height="18" rx="9" fill="#e3edf0" stroke="#2D6A7F" stroke-width="0.8"/>
        <text x="60" y="12" text-anchor="middle" class="badge-text" fill="#2D6A7F">Thermo RawFileParser</text>
      </g>
    </g>
    <path class="edge-sparx" d="M275,244 L275,270" marker-end="url(#arrow-sparx)"/>

    <!-- Search Mode diamond -->
    <g transform="translate(275,302)">
      <polygon points="0,-32 105,0 0,32 -105,0" fill="#7B6FA0" stroke="#5b5278" stroke-width="1"/>
      <text x="0" y="-3" text-anchor="middle" class="lbl lbl-w lbl-b">Search Mode</text>
      <text x="0" y="13" text-anchor="middle" class="lbl-tiny" fill="#ffffff" style="fill: rgb(255, 255, 255)">--mode</text>
    </g>

    <!-- Branches -->
    <g transform="translate(40,378)">
      <rect width="200" height="56" rx="8" fill="#ffffff" stroke="#2D6A7F" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="56" rx="3" fill="#2D6A7F"/>
      <text x="106" y="24" text-anchor="middle" class="lbl lbl-b">Conventional Approach</text>
      <text x="106" y="42" text-anchor="middle" class="lbl-sm">Whole DB</text>
    </g>
    <g transform="translate(310,378)">
      <rect width="200" height="56" rx="8" fill="#ffffff" stroke="#2D6A7F" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="56" rx="3" fill="#2D6A7F"/>
      <text x="106" y="24" text-anchor="middle" class="lbl lbl-b">Binning Approach</text>
      <text x="106" y="42" text-anchor="middle" class="lbl-sm">DB by Parts</text>
    </g>

    <path class="edge-sparx" d="M192,318 C155,340 135,355 145,378" marker-end="url(#arrow-sparx)"/>
    <path class="edge-sparx" d="M358,318 C395,340 415,355 405,378" marker-end="url(#arrow-sparx)"/>
    <g>
      <rect x="113" y="332" width="74" height="14" rx="3" class="edge-lbl-bg"/>
      <text x="150" y="342" text-anchor="middle" class="edge-lbl">conventional</text>
    </g>
    <g>
      <rect x="373" y="332" width="56" height="14" rx="3" class="edge-lbl-bg"/>
      <text x="401" y="342" text-anchor="middle" class="edge-lbl">binning</text>
    </g>

    <!-- Convergence rail -->
    <path class="edge-sparx" d="M145,434 L145,464 L275,464"/>
    <path class="edge-sparx" d="M405,434 L405,464 L275,464"/>
    <circle cx="275" cy="464" r="3" fill="#2D6A7F"/>
    <path class="edge-sparx" d="M275,464 L275,484" marker-end="url(#arrow-sparx)"/>

    <!-- MS-GF+ -->
    <g transform="translate(155,484)">
      <rect width="240" height="54" rx="8" fill="#ffffff" stroke="#2D6A7F" stroke-width="1.4"/>
      <text x="120" y="22" text-anchor="middle" class="lbl lbl-b">Formatted MS-GF+ Output Tables</text>
      <text x="120" y="40" text-anchor="middle" class="lbl-sm">peptide–spectrum matching</text>
      <g transform="translate(178,-10)">
        <rect width="62" height="18" rx="9" fill="#e3edf0" stroke="#2D6A7F" stroke-width="0.8"/>
        <text x="31" y="12" text-anchor="middle" class="badge-text" fill="#2D6A7F">MS-GF+</text>
      </g>
    </g>
    <path class="edge-sparx" d="M275,538 L275,562" marker-end="url(#arrow-sparx)"/>

    <!-- MASIC -->
    <g transform="translate(155,562)">
      <rect width="240" height="54" rx="8" fill="#ffffff" stroke="#2D6A7F" stroke-width="1.4"/>
      <text x="120" y="22" text-anchor="middle" class="lbl lbl-b">Append MASIC Statistics</text>
      <text x="120" y="40" text-anchor="middle" class="lbl-sm">selected-ion chromatograms</text>
      <g transform="translate(186,-10)">
        <rect width="54" height="18" rx="9" fill="#e3edf0" stroke="#2D6A7F" stroke-width="0.8"/>
        <text x="27" y="12" text-anchor="middle" class="badge-text" fill="#2D6A7F">MASIC</text>
      </g>
    </g>
    <path class="edge-sparx" d="M275,616 L275,640" marker-end="url(#arrow-sparx)"/>

    <!-- PHRP -->
    <g transform="translate(155,640)">
      <rect width="240" height="54" rx="8" fill="#ffffff" stroke="#2D6A7F" stroke-width="1.4"/>
      <text x="120" y="22" text-anchor="middle" class="lbl lbl-b">PHRP post-processing</text>
      <text x="120" y="40" text-anchor="middle" class="lbl-sm">PSM normalization</text>
      <g transform="translate(192,-10)">
        <rect width="48" height="18" rx="9" fill="#e3edf0" stroke="#2D6A7F" stroke-width="0.8"/>
        <text x="24" y="12" text-anchor="middle" class="badge-text" fill="#2D6A7F">PHRP</text>
      </g>
    </g>
    <path class="edge-sparx" d="M275,694 L275,718" marker-end="url(#arrow-sparx)"/>

    <!-- MASIC Merge -->
    <g transform="translate(175,718)">
      <rect width="200" height="44" rx="8" fill="#ffffff" stroke="#2D6A7F" stroke-width="1.4"/>
      <text x="100" y="20" text-anchor="middle" class="lbl lbl-b">MASIC Merge</text>
      <text x="100" y="35" text-anchor="middle" class="lbl-sm">Append MASIC Statistics</text>
    </g>
    <path class="edge-sparx" d="M275,762 L275,790" marker-end="url(#arrow-sparx)"/>

    <!-- PSMs Feature Directory at bottom of SPARX column -->
    <g transform="translate(155,790)">
      <rect width="240" height="60" rx="10" fill="#2D6A7F" stroke="#1c4856" stroke-width="1"/>
      <text x="120" y="26" text-anchor="middle" class="lbl lbl-w lbl-b">PSMs Feature Directory</text>
      <text x="120" y="44" text-anchor="middle" class="lbl-sm lbl-w" fill="#ffffff"> Feature Rich MS-GF+ Tables </text>
    </g>
  </g>

  <!-- skip-sparx bypass: hugs the left edge from input manifold to PSMs Feature Directory -->
  <path class="edge-skip" d="M275,108 L8,108 L8,820 L115,820" marker-end="url(#arrow-skip)"/>
  <g>
    <rect x="-2" y="98" width="100" height="20" rx="4" fill="#ffffff" stroke="#9b9a93" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="48" y="112" text-anchor="middle" class="edge-lbl" fill="#5a5d6a">--skip-sparx</text>
  </g>

  <!-- SPARX → XPECTRA handoff: PSMs Feature Directory exits right → short horizontal edge into Rescore diamond -->
  <path class="edge" d="M395,820 L750,820" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 2: XPECTRA (middle column) ============ -->
  <g id="stage-xpectra">
    <rect x="550" y="130" width="420" height="780" rx="10" ry="10"
          fill="#fbf4ea" stroke="#C47B2B" stroke-opacity="0.45" stroke-width="1.2"
          stroke-dasharray="6 4"/>
    <rect x="550" y="130" width="420" height="780" rx="10" ry="10" fill="url(#grain)"/>


  <!-- skip-rescore dashed path (between panels and nodes) -->
  <path class="edge-skip" d="M710,820 L1115,820" marker-end="url(#arrow-skip)"/>

    <rect x="550" y="130" width="200" height="26" rx="10" ry="10" fill="#C47B2B"/>
    <rect x="550" y="143" width="200" height="13" fill="#C47B2B"/>
    <text x="566" y="147" class="lbl-stage" fill="#ffffff">STAGE 2</text>
    <text x="626" y="147" class="lbl-stage" fill="#ffffff">·  XPECTRA</text>
    <g transform="translate(880,135)">
      <rect width="78" height="18" rx="9" fill="#ffffff" stroke="#C47B2B" stroke-width="1"/>
      <text x="39" y="12" text-anchor="middle" class="badge-text" fill="#C47B2B">OPTIONAL</text>
    </g>
    <text x="566" y="172" class="lbl-sm" fill="#C47B2B">Machine-learning rescoring of PSMs</text>

    <!-- Rescore diamond inside XPECTRA, aligned to PSMs Feature Directory Y for clean horizontal handoff -->
    <g transform="translate(750,820)">
      <polygon points="0,-32 65,0 0,32 -65,0" fill="#7B6FA0" stroke="#5b5278" stroke-width="1"/>
      <text x="0" y="-3" text-anchor="middle" class="lbl lbl-w lbl-b">Rescore</text>
      <text x="0" y="13" text-anchor="middle" class="lbl-tiny lbl-w">--rescore</text>

    </g>

    <!-- yes path: from diamond top up to bottom of inner ML box, exits inner box right side -->
    <path class="edge-xpec" d="M750,788 L750,760" marker-end="url(#arrow-xpec)"/>
    <g>
      <rect x="740" y="770" width="22" height="14" rx="3" fill="#ffffff"/>
      <text x="750" y="780" text-anchor="middle" class="edge-lbl">yes</text>
    </g>

    <!-- skip path: dashed horizontal from Rescore right → around panel → into FDR (same Y) -->

    <path class="edge-skip" d="M710,820 L1115,820" marker-end="url(#arrow-skip)"/>

    <!-- Rescore diamond -->
    <g transform="translate(750,820)">
      <polygon points="0,-32 65,0 0,32 -65,0" fill="#7B6FA0" stroke="#5b5278" stroke-width="1"/>
      <text x="0" y="-3" text-anchor="middle" class="lbl lbl-w lbl-b">Rescore</text>
      <text x="0" y="13" text-anchor="middle" class="lbl-tiny lbl-w">--rescore</text>
    </g>

    <g>
      <rect x="875" y="812" width="70" height="16" rx="3" fill="#ffffff"/>
      <text x="910" y="824" text-anchor="middle" class="edge-lbl" fill="#5a5d6a">skip rescore</text>
    </g>

    <!-- XPECTRA inner box: now bottom-up flow ending at top with Rescored PSMs feeding QUANTIX FDR -->
    <rect x="580" y="195" width="360" height="570" rx="8" fill="#ffffff" stroke="#C47B2B" stroke-width="1.2"/>

    <!-- Bottom of inner box: Feature extraction (entry from Rescore yes path) -->
    <g transform="translate(600,690)">
      <!-- <rect width="280" height="60" rx="8" fill="#fbf4ea" stroke="#C47B2B" stroke-width="1.2"/> -->
      <rect width="320" height="56" rx="8" fill="#fbf4ea" stroke="#C47B2B" stroke-width="1.2"/>
      <text x="160" y="24" text-anchor="middle" class="lbl lbl-b">Feature extraction</text>
      <text x="160" y="40" text-anchor="middle" class="lbl-sm">spectra · ions · charge</text>
    </g>
    <path class="edge-xpec" d="M760,690 L760,672" marker-end="url(#arrow-xpec)"/>

    <g transform="translate(600,610)">
      <rect width="320" height="56" rx="8" fill="#fbf4ea" stroke="#C47B2B" stroke-width="1.2"/>
      <text x="160" y="24" text-anchor="middle" class="lbl lbl-b">RT Prediction / Calibration</text>
      <text x="160" y="40" text-anchor="middle" class="lbl-sm">retention-time model · ΔRT</text>
    </g>
    <path class="edge-xpec" d="M760,610 L760,592" marker-end="url(#arrow-xpec)"/>

    <g transform="translate(600,530)">
      <rect width="320" height="56" rx="8" fill="#fbf4ea" stroke="#C47B2B" stroke-width="1.2"/>
      <text x="160" y="24" text-anchor="middle" class="lbl lbl-b">XGBoost ensemble (n = 5)</text>
      <text x="160" y="40" text-anchor="middle" class="lbl-sm">target–decoy boosted models</text>
      <g transform="translate(244,-10)">
        <rect width="60" height="18" rx="9" fill="#f5e7d4" stroke="#C47B2B" stroke-width="0.8"/>
        <text x="30" y="12" text-anchor="middle" class="badge-text" fill="#C47B2B">XGBoost</text>
      </g>
    </g>
    <path class="edge-xpec" d="M760,530 L760,512" marker-end="url(#arrow-xpec)"/>

    <g transform="translate(600,450)">
      <rect width="320" height="56" rx="8" fill="#fbf4ea" stroke="#C47B2B" stroke-width="1.2"/>
      <text x="160" y="24" text-anchor="middle" class="lbl lbl-b">Cross-validation</text>
      <text x="160" y="40" text-anchor="middle" class="lbl-sm">k-fold · out-of-fold scoring</text>
    </g>
    <path class="edge-xpec" d="M760,450 L760,432" marker-end="url(#arrow-xpec)"/>

    <!-- Top of inner box: Rescored PSMs (terminal node feeds QUANTIX) -->
    <g transform="translate(600,360)">
      <rect width="320" height="64" rx="8" fill="#ffffff" stroke="#C47B2B" stroke-width="1.6"/>
      <text x="160" y="28" text-anchor="middle" class="lbl lbl-b">Rescored PSMs</text>
      <text x="160" y="46" text-anchor="middle" class="lbl-sm" fill="#C47B2B">probability score</text>
    </g>

    <!-- XPECTRA → QUANTIX handoff: Rescored PSMs exits right → elbow down to FDR Y -->
    <path class="edge-xpec" d="M920,392 L975,392 L975,240 L1115,240" marker-end="url(#arrow-xpec)"/>
  </g>

  <!-- ============ STAGE 3: QUANTIX (right column) ============ -->
  <g id="stage-quantix">
    <rect x="990" y="130" width="490" height="780" rx="10" ry="10"
          fill="#f0f6f0" stroke="#3A7D44" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="990" y="130" width="490" height="780" rx="10" ry="10" fill="url(#grain)"/>

    <rect x="990" y="130" width="180" height="26" rx="10" ry="10" fill="#3A7D44"/>
    <rect x="990" y="143" width="180" height="13" fill="#3A7D44"/>
    <text x="1006" y="147" class="lbl-stage" fill="#ffffff">STAGE 3</text>
    <text x="1066" y="147" class="lbl-stage" fill="#ffffff">·  QUANTIX</text>
    <text x="1006" y="172" class="lbl-sm" fill="#3A7D44">Filtering, Rollup & quantification</text>

    <!-- 3 sequential steps stacked vertically -->
    <g transform="translate(1115,200)">
      <rect width="240" height="80" rx="8" fill="#ffffff" stroke="#3A7D44" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="80" rx="3" fill="#3A7D44"/>
      <text x="123" y="34" text-anchor="middle" class="lbl lbl-b">FDR filtering</text>
      <text x="123" y="52" text-anchor="middle" class="lbl-sm"> score threshold</text>
    </g>
    <path class="edge-quant" d="M1235,280 L1235,310" marker-end="url(#arrow-quant)"/>

    <g transform="translate(1115,310)">
      <rect width="240" height="80" rx="8" fill="#ffffff" stroke="#3A7D44" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="80" rx="3" fill="#3A7D44"/>
      <text x="123" y="34" text-anchor="middle" class="lbl lbl-b">Peptide Intesnity Table</text>
      <text x="123" y="52" text-anchor="middle" class="lbl-sm">Consolidated Peptide Intesities</text>
    </g>
    <path class="edge-quant" d="M1235,390 L1235,420" marker-end="url(#arrow-quant)"/>

    <g transform="translate(1115,420)">
      <rect width="240" height="80" rx="8" fill="#ffffff" stroke="#3A7D44" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="80" rx="3" fill="#3A7D44"/>

<figcaption style="width:min(1500px,100%);">
  <b>Fig. 1.</b> MSGFLEX pipeline overview. Inputs (RAW/mzML, FASTA, params) feed into <b>SPARX</b> (Stage 1), which converts vendor files via <i>Thermo RawFileParser</i>, then routes through either the conventional or binning sub-pipeline before converging through MS-GF+, MASIC and PHRP into a merged <i>PSMs Feature Directory</i>. <b>XPECTRA</b> (Stage 2, optional) rescores PSMs through feature extraction, RT prediction and calibration, an XGBoost ensemble (<i>n</i> = 5), and <i>k</i>-fold cross-validation, emitting <code>xpec_q</code>. <b>QUANTIX</b> (Stage 3) applies FDR filtering, peptide cross-tab and protein rollup, producing the <b>Protein Feature Table</b>. Dashed paths indicate optional stages (<code>--skip-sparx</code>, <code>--rescore</code>).
</figcaption>
